<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Educational Game Collection</title>
    <meta name="description" content="A minimalist educational game collection optimized for mobile">
    <link rel="stylesheet" href="style.css?v=2.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
        <!-- HUD (計時器與生命值) -->
        <div id="hud" class="hidden">
            <div class="hud-left">
                <div id="level-indicator">Lv 1</div>
                <div id="time-display">00:00</div>
            </div>
            <div class="hud-right">
                <div id="lives-display"></div>
            </div>
        </div>

        <!-- Survival HUD -->
        <div id="survival-hud" class="hidden">
            <div id="exp-bar">
                <div id="exp-fill"></div>
            </div>
            <div class="survival-stats">
                <div id="survival-time">00:00</div>
                <div id="survival-level">Lv. 1</div>
                <div id="hp-bar-container">
                    <div id="hp-fill"></div>
                    <div id="hp-text">100 / 100</div>
                </div>
            </div>
        </div>

        <!-- Level Up Screen -->
        <div id="level-up-screen" class="hidden">
            <div class="level-up-container glass-panel">
                <h2>Level Up!</h2>
                <div id="level-up-options">
                    <!-- Options injected here -->
                </div>
            </div>
        </div>

        <!-- 死亡答題畫面 -->
        <div id="question-screen" class="hidden">
            <h2 id="question-title">問題</h2>
            <div id="question-options" class="options-grid"></div>
        </div>

        <div id="score" class="hidden">00000</div>
        
        <!-- Game Hub 選單 -->
        <div id="hub-screen">
            <h1>Game Hub</h1>
            <p>教育小遊戲集合</p>
            <p class="subtitle">EDUCATIONAL GAME COLLECTION</p>
            <div class="options-grid" style="margin-top: 2rem;">
                <!-- Phase 2 Complete, Phase 3 enabled -->
                <button id="btn-play-maze" class="option-btn">迷宮跑酷 (Maze Platformer)</button>
                <button id="btn-play-survival" class="option-btn">怪獸生存 (Monster Survival)</button>
                <button id="btn-play-puzzle" class="option-btn" disabled>邏輯解謎 (Logic Puzzle - 敬請期待)</button>
            </div>
        </div>
        
        <div id="start-screen" class="hidden">
                <h1>迷宮跑酷</h1>
                <p>探索封閉迷宮，躲避紅色陷阱，尋找綠色終點！</p>
                <p class="subtitle">MAZE PLATFORMER</p>
                <p style="margin-top: 1.5rem; font-size: 0.9rem;">點擊螢幕 或 按空白鍵開始</p>
            </div>
            
            <div id="game-over-screen" class="hidden">
                <h2 id="end-title">GAME OVER</h2>
                <p id="end-msg">你碰到了陷阱...</p>
                <div id="leaderboard-container" class="hidden">
                    <h3 class="leaderboard-title">🏆 最佳成績 🏆</h3>
                    <ul id="leaderboard-list"></ul>
                </div>
                <p style="margin-top: 1rem; font-size: 0.9rem;">點擊螢幕重新開始</p>
            </div>
        </div>

        <!-- 虛擬按鍵 (Mobile Controls) -->
        <div id="mobile-controls" class="hidden">
            <div class="control-group-left">
                <button id="btn-left" class="control-btn">◀</button>
                <button id="btn-right" class="control-btn">▶</button>
            </div>
            <div class="control-group-right">
                <button id="btn-jump" class="control-btn jump-btn">▲</button>
                <div id="joystick-right" class="joystick-base hidden">
                    <div id="joystick-knob" class="joystick-knob"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/main.js?v=2.1"></script>
</body>
</html>
